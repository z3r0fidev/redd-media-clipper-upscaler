name: Release

# Builds installers and standalone CLI archives for a version tag. Publishing (GitHub release,
# signing) is a separate, manual step — see README › Releasing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# The steps are bash scripts on both platforms (PowerShell rejects `rm -rf`).
defaults:
  run:
    shell: bash

jobs:
  package:
    name: package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
            bundles: deb,appimage
            exe: ""
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
            bundles: nsis,msi
            exe: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        # GStreamer is bundled into the AppImage (WebKitGTK needs it for <video>). The runner image
        # preinstalls libunwind-14-dev, which conflicts with the libunwind-dev GStreamer needs.
        run: >-
          sudo apt-get update && (sudo apt-get remove -y libunwind-14-dev || true)
          && sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev
          libayatana-appindicator3-dev patchelf libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
          gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target
      - name: Stage bundled programs and models (pinned FFmpeg, ncnn and models; release CLI and AI worker)
        run: |
          cargo xtask fetch-tools --target ${{ matrix.triple }}
          # Never reuse cached archives or libraries for a release: fetch and verify afresh.
          rm -rf third_party target/xtask-archives
          cargo xtask fetch-ncnn --target ${{ matrix.triple }}
          cargo xtask fetch-models
          cargo xtask stage-cli --target ${{ matrix.triple }}
      - name: Tests must pass before packaging
        shell: bash
        env:
          RMEDIA_REQUIRE_FFMPEG: "1"
          RMEDIA_FFMPEG: ${{ github.workspace }}/binaries/rmedia-ffmpeg-${{ matrix.triple }}${{ matrix.exe }}
          RMEDIA_FFPROBE: ${{ github.workspace }}/binaries/rmedia-ffprobe-${{ matrix.triple }}${{ matrix.exe }}
        run: cargo test --workspace
      - name: Frontend dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Third-party notices are current (covers both platforms)
        if: runner.os == 'Linux'
        run: cargo xtask notices && git diff --exit-code -- THIRD_PARTY_NOTICES.md
      - name: Build installers
        working-directory: apps/desktop
        run: npx tauri build --bundles ${{ matrix.bundles }}
      - name: Standalone CLI archive
        shell: bash
        run: |
          ref=$(echo "${GITHUB_REF_NAME}" | tr -c 'A-Za-z0-9._-' '-' | sed 's/-*$//')
          name=rmedia-cli-${ref}-${{ matrix.triple }}
          mkdir -p "dist/$name/licenses" "dist/$name/models"
          cp binaries/rmedia-${{ matrix.triple }}${{ matrix.exe }} "dist/$name/rmedia${{ matrix.exe }}"
          cp binaries/rmedia-sr-${{ matrix.triple }}${{ matrix.exe }} "dist/$name/rmedia-sr${{ matrix.exe }}"
          cp models/face_detection_yunet_2026may.onnx models/realesr-animevideov3-x?.param models/realesr-animevideov3-x?.bin "dist/$name/models/"
          cp binaries/rmedia-ffmpeg-${{ matrix.triple }}${{ matrix.exe }} "dist/$name/rmedia-ffmpeg${{ matrix.exe }}"
          cp binaries/rmedia-ffprobe-${{ matrix.triple }}${{ matrix.exe }} "dist/$name/rmedia-ffprobe${{ matrix.exe }}"
          cp THIRD_PARTY_NOTICES.md licenses/FFMPEG-NOTICE.md licenses/FFMPEG-LICENSE.txt licenses/NCNN-NOTICE.md \
            licenses/NCNN-LICENSE.txt licenses/GLSLANG-LICENSE.txt "dist/$name/licenses/"
          cp README.md "dist/$name/"
          cd dist && if [ "${{ runner.os }}" = "Windows" ]; then 7z a "$name.zip" "$name" >/dev/null; else tar -czf "$name.tar.gz" "$name"; fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rmedia-${{ matrix.triple }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/**/*.deb
            apps/desktop/src-tauri/target/release/bundle/**/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/**/*.exe
            apps/desktop/src-tauri/target/release/bundle/**/*.msi
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
