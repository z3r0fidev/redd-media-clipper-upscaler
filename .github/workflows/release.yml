name: Release

# Builds installers and standalone CLI archives for a version tag. Publishing (GitHub release,
# signing) is a separate, manual step — see README › Releasing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      gifski:
        description: "Bundle gifski (AGPL-3.0). Off by default (owner decision 2026-10-27: releases ship without it); on needs an allowed app_licence or the release gate fails."
        type: boolean
        default: false

permissions:
  contents: read

# The steps are bash scripts on both platforms (PowerShell rejects `rm -rf`).
defaults:
  run:
    shell: bash

env:
  # Tag pushes have no inputs: gifski is bundled, and the release gate decides.
  WITH_GIFSKI: ${{ github.event_name != 'workflow_dispatch' || inputs.gifski }}

jobs:
  package:
    name: package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
            bundles: deb,appimage
            exe: ""
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
            bundles: nsis,msi
            exe: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      # FR-025: gifski (AGPL-3.0) ships only after the application licence decision.
      - name: Release gate (before staging)
        run: cargo xtask check-release-gate
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        # GStreamer is bundled into the AppImage (WebKitGTK needs it for <video>). The runner image
        # preinstalls libunwind-14-dev, which conflicts with the libunwind-dev GStreamer needs.
        run: >-
          sudo apt-get update && (sudo apt-get remove -y libunwind-14-dev || true)
          && sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev
          libayatana-appindicator3-dev patchelf libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
          gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target
      - name: Stage bundled programs and models (pinned FFmpeg, ncnn and models; release CLI and AI worker)
        run: |
          if [ "$WITH_GIFSKI" = true ]; then
            cargo xtask fetch-tools --target ${{ matrix.triple }}
          else
            cargo xtask fetch-tools --target ${{ matrix.triple }} --no-gifski
          fi
          # Never reuse cached archives or libraries for a release: fetch and verify afresh.
          rm -rf third_party target/xtask-archives
          cargo xtask fetch-ncnn --target ${{ matrix.triple }}
          cargo xtask fetch-models
          cargo xtask stage-cli --target ${{ matrix.triple }}
      - name: Release gate (after staging)
        run: cargo xtask check-release-gate
      - name: Tests must pass before packaging
        shell: bash
        env:
          RMEDIA_REQUIRE_FFMPEG: "1"
          RMEDIA_FFMPEG: ${{ github.workspace }}/binaries/rmedia-ffmpeg-${{ matrix.triple }}${{ matrix.exe }}
          RMEDIA_FFPROBE: ${{ github.workspace }}/binaries/rmedia-ffprobe-${{ matrix.triple }}${{ matrix.exe }}
        run: cargo test --workspace
      - name: Frontend dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Third-party notices are current (covers both platforms)
        if: runner.os == 'Linux'
        run: cargo xtask notices && git diff --exit-code -- THIRD_PARTY_NOTICES.md
      - name: Build installers
        working-directory: apps/desktop
        run: |
          if [ "$WITH_GIFSKI" = true ]; then
            npx tauri build --bundles ${{ matrix.bundles }}
          else
            # A JSON merge patch over tauri.conf.json: the sidecar list without gifski, and its
            # licence files removed (null).
            jq -c '{bundle: {externalBin: [.bundle.externalBin[] | select(endswith("/rmedia-gifski") | not)],
              resources: (.bundle.resources | with_entries(select(.key | contains("/GIFSKI-")) | .value = null))}}' \
              src-tauri/tauri.conf.json > "$RUNNER_TEMP/no-gifski.json"
            # The patch must drop exactly one sidecar and the three gifski licence files.
            jq -e '[.bundle.externalBin[] | select(endswith("/rmedia-gifski"))] | length == 1' src-tauri/tauri.conf.json
            jq -e '.bundle.resources | length == 3' "$RUNNER_TEMP/no-gifski.json"
            npx tauri build --bundles ${{ matrix.bundles }} --config "$RUNNER_TEMP/no-gifski.json"
          fi
      - name: Standalone CLI archive
        shell: bash
        run: |
          ref=$(echo "${GITHUB_REF_NAME}" | tr -c 'A-Za-z0-9._-' '-' | sed 's/-*$//')
          name=rmedia-cli-${ref}-${{ matrix.triple }}
          mkdir -p "dist/$name/licenses" "dist/$name/models"
          cp binaries/rmedia-${{ matrix.triple }}${{ matrix.exe }} "dist/$name/rmedia${{ matrix.exe }}"
          cp binaries/rmedia-sr-${{ matrix.triple }}${{ matrix.exe }} "dist/$name/rmedia-sr${{ matrix.exe }}"
          cp models/face_detection_yunet_2026may.onnx models/realesr-animevideov3-x?.param models/realesr-animevideov3-x?.bin "dist/$name/models/"
          cp binaries/rmedia-ffmpeg-${{ matrix.triple }}${{ matrix.exe }} "dist/$name/rmedia-ffmpeg${{ matrix.exe }}"
          cp binaries/rmedia-ffprobe-${{ matrix.triple }}${{ matrix.exe }} "dist/$name/rmedia-ffprobe${{ matrix.exe }}"
          cp binaries/rmedia-gifsicle-${{ matrix.triple }}${{ matrix.exe }} "dist/$name/rmedia-gifsicle${{ matrix.exe }}"
          cp THIRD_PARTY_NOTICES.md licenses/FFMPEG-NOTICE.md licenses/FFMPEG-LICENSE.txt licenses/NCNN-NOTICE.md \
            licenses/NCNN-LICENSE.txt licenses/GLSLANG-LICENSE.txt licenses/GIFSICLE-NOTICE.md \
            licenses/GIFSICLE-COPYING.txt "dist/$name/licenses/"
          if [ "$WITH_GIFSKI" = true ]; then
            cp binaries/rmedia-gifski-${{ matrix.triple }}${{ matrix.exe }} "dist/$name/rmedia-gifski${{ matrix.exe }}"
            cp licenses/GIFSKI-NOTICE.md licenses/GIFSKI-LICENSE.txt licenses/GIFSKI-DEPS.md "dist/$name/licenses/"
          fi
          cp README.md "dist/$name/"
          cd dist && if [ "${{ runner.os }}" = "Windows" ]; then 7z a "$name.zip" "$name" >/dev/null; else tar -czf "$name.tar.gz" "$name"; fi
      # The built installers and archives, not just the staged names: any gifski file (or an
      # NSIS/WiX script naming it) needs the same licence decision.
      - name: Release gate (built bundles and archives)
        run: cargo xtask check-release-gate --scan apps/desktop/src-tauri/target/release --scan dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rmedia-${{ matrix.triple }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/**/*.deb
            apps/desktop/src-tauri/target/release/bundle/**/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/**/*.exe
            apps/desktop/src-tauri/target/release/bundle/**/*.msi
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
