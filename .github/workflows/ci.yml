name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # weekly: catch new advisories against unchanged code

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RMEDIA_REQUIRE_FFMPEG: "1"

# Third-party actions are pinned to full commit SHAs (version in the comment).
# The Rust toolchain comes from rust-toolchain.toml via the runner's preinstalled rustup.

jobs:
  test:
    name: test (${{ matrix.os }}, bundled engine)
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
            exe: ""
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
            exe: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Fetch pinned engine (sha256-verified)
        run: cargo xtask fetch-tools --target ${{ matrix.triple }}
      - name: Test against the bundled engine
        shell: bash
        env:
          RMEDIA_FFMPEG: ${{ github.workspace }}/binaries/rmedia-ffmpeg-${{ matrix.triple }}${{ matrix.exe }}
          RMEDIA_FFPROBE: ${{ github.workspace }}/binaries/rmedia-ffprobe-${{ matrix.triple }}${{ matrix.exe }}
        run: |
          cargo test --workspace
          cargo test --workspace --release -- --ignored bench

  minimum-engine:
    name: test (ubuntu-24.04, distro ffmpeg 6.1 = minimum supported)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: cargo test --workspace

  windows-check-gnu:
    name: type-check Windows code paths from Linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup target add x86_64-pc-windows-gnu
      - run: cargo check --workspace --all-targets --target x86_64-pc-windows-gnu

  desktop:
    name: desktop app (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - name: Linux webview build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev ffmpeg
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target
      - name: Generated TypeScript bindings are up to date
        shell: bash
        run: |
          cargo xtask gen-bindings
          git diff --exit-code -- apps/desktop/src/lib/bindings
      - name: Frontend checks and tests
        working-directory: apps/desktop
        run: |
          npm ci
          npm run check
          npm test
          npm run build
      - name: Desktop backend tests (media server, bridge, CLI parity)
        if: runner.os == 'Linux'
        run: |
          cargo build -p rmedia-cli
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Desktop backend builds on Windows
        if: runner.os == 'Windows'
        run: cargo build --manifest-path apps/desktop/src-tauri/Cargo.toml

  deny:
    name: cargo-deny (${{ matrix.manifest }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        manifest: [Cargo.toml, apps/desktop/src-tauri/Cargo.toml]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: ${{ matrix.manifest }}
