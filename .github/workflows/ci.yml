name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # weekly: catch new advisories against unchanged code

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RMEDIA_REQUIRE_FFMPEG: "1"

# Third-party actions are pinned to full commit SHAs (version in the comment).
# The Rust toolchain comes from rust-toolchain.toml via the runner's preinstalled rustup.

jobs:
  test:
    name: test (${{ matrix.os }}, bundled engine)
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
            exe: ""
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
            exe: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Format
        run: cargo fmt --all -- --check
      # Every pinned archive has a mirror, and the FFmpeg pin has its GPL source release and notice.
      - name: Pins are mirrored and sourced, and every mirror answers
        run: cargo xtask check-pins --online
      # rmedia-sr (the AI worker, US6) links the prebuilt ncnn; build.rs stops without it.
      # No cache: the libraries are linked into the worker, so they are fetched and verified each run.
      - name: Fetch pinned ncnn (sha256-verified)
        run: cargo xtask fetch-ncnn --target ${{ matrix.triple }}
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Fetch pinned engine (sha256-verified)
        run: cargo xtask fetch-tools --target ${{ matrix.triple }}
      - name: Cache model files
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: models
          key: models-${{ hashFiles('xtask/models.lock.json') }}
      - name: Fetch pinned models (sha256-verified)
        run: cargo xtask fetch-models
      - name: Test against the bundled engine
        shell: bash
        env:
          RMEDIA_FFMPEG: ${{ github.workspace }}/binaries/rmedia-ffmpeg-${{ matrix.triple }}${{ matrix.exe }}
          RMEDIA_FFPROBE: ${{ github.workspace }}/binaries/rmedia-ffprobe-${{ matrix.triple }}${{ matrix.exe }}
        run: |
          cargo test --workspace --no-fail-fast
          cargo test --workspace --release -- --ignored bench

  minimum-engine:
    name: test (ubuntu-24.04, distro ffmpeg 6.1 = minimum supported)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      # Only the engine differs from the bundled jobs: the app's pinned models and the AI worker
      # are present too (smart reframe needs the face detector; the AI pipeline tests run the
      # worker's GPU-free built-in model through this ffmpeg).
      - name: Fetch pinned ncnn (sha256-verified)
        run: cargo xtask fetch-ncnn
      - name: Cache model files
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: models
          key: models-${{ hashFiles('xtask/models.lock.json') }}
      - name: Fetch pinned models (sha256-verified)
        run: cargo xtask fetch-models
      # 002 tests need filters/encoders a distro build may lack (libvmaf, ...); they skip here
      # through testkit::require_engine and run for real in the bundled-engine jobs.
      - run: cargo test --workspace --no-fail-fast
        env:
          RMEDIA_ALLOW_MISSING_FEATURES: "1"

  windows-check-gnu:
    name: type-check Windows code paths from Linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup target add x86_64-pc-windows-gnu
      # tract-linalg's build script compiles C for the target.
      - run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      # rmedia-sr links the MSVC build of ncnn; it is checked by the Windows test job instead.
      - run: cargo check --workspace --all-targets --target x86_64-pc-windows-gnu --exclude rmedia-sr

  desktop:
    name: desktop app (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - name: Linux webview build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target
      - name: Stage sidecars and models (tauri-build requires the bundled files to exist)
        run: |
          cargo xtask fetch-tools --target ${{ matrix.triple }}
          cargo xtask fetch-ncnn --target ${{ matrix.triple }}
          cargo xtask fetch-models
          cargo xtask stage-cli --target ${{ matrix.triple }}
      - name: Generated TypeScript bindings are up to date
        shell: bash
        run: |
          cargo xtask gen-bindings
          git diff --exit-code -- apps/desktop/src/lib/bindings
      - name: Frontend checks and tests
        working-directory: apps/desktop
        run: |
          npm ci
          npm run check
          npm test
          npm run build
      - name: Desktop backend tests (media server, bridge, CLI parity)
        if: runner.os == 'Linux'
        # The pinned engine staged above (the runner's distro FFmpeg is too old, or absent).
        env:
          RMEDIA_FFMPEG: ${{ github.workspace }}/binaries/rmedia-ffmpeg-${{ matrix.triple }}
          RMEDIA_FFPROBE: ${{ github.workspace }}/binaries/rmedia-ffprobe-${{ matrix.triple }}
        run: |
          cargo build -p rmedia-cli
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --no-fail-fast
      - name: Third-party notices are up to date
        if: runner.os == 'Linux'
        run: |
          cargo xtask notices
          git diff --exit-code -- THIRD_PARTY_NOTICES.md
      - name: Desktop backend builds on Windows
        if: runner.os == 'Windows'
        run: cargo build --manifest-path apps/desktop/src-tauri/Cargo.toml

  deny:
    name: cargo-deny (${{ matrix.manifest }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        manifest: [Cargo.toml, apps/desktop/src-tauri/Cargo.toml]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: ${{ matrix.manifest }}
