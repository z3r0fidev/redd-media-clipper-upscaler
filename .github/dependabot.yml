version: 2
# One grouped pull request per ecosystem and week (each one runs the full CI matrix) for minor
# and patch updates. Major updates are not grouped: each one gets its own pull request, because
# it may need code changes.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo-workspace:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: /apps/desktop/src-tauri
    schedule:
      interval: weekly
    groups:
      cargo-desktop:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /apps/desktop
    schedule:
      interval: weekly
    ignore:
      # svelte-check 4.7.x cannot install with TypeScript 7 (npm ERESOLVE, 2026-11-13). Remove
      # this once svelte-check supports it.
      - dependency-name: typescript
        versions: [">=7"]
    groups:
      npm-desktop:
        patterns: ["*"]
        update-types: [minor, patch]
