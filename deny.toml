[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # Unmaintained, not vulnerable. A build-time proc-macro of gtk-rs 0.18 (glib-macros), which
  # Tauri's Linux backend (gtk, webkit2gtk) depends on; no runtime code. Desktop app only; it goes
  # away when Tauri leaves gtk-rs 0.18. Recheck on each Tauri upgrade.
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error (unmaintained): build-time proc-macro of gtk-rs 0.18 (glib-macros) via Tauri's Linux backend" },
]

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
         "ISC", "Unicode-3.0", "Zlib", "MPL-2.0", "CC0-1.0"]
confidence-threshold = 0.9
# rmedia's own crates are AGPL-3.0-or-later (owner decision 2026-11-13); every dependency must
# still be permissive.
exceptions = [
  { allow = ["AGPL-3.0-or-later"], crate = "rmedia-core" },
  { allow = ["AGPL-3.0-or-later"], crate = "rmedia-cli" },
  { allow = ["AGPL-3.0-or-later"], crate = "rmedia-sr" },
  { allow = ["AGPL-3.0-or-later"], crate = "rmedia-testkit" },
  { allow = ["AGPL-3.0-or-later"], crate = "xtask" },
  { allow = ["AGPL-3.0-or-later"], crate = "rmedia-desktop" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
