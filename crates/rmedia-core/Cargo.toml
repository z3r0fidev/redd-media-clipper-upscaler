[package]
name = "rmedia-core"
description = "Core media logic for rmedia: timestamps, probing, planning and executing clip jobs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# TypeScript bindings for the desktop app (`cargo xtask gen-bindings`).
ts = ["dep:ts-rs"]
# Test-only helpers (e.g. `MarkerDetector`) for this crate's integration tests.
test-support = []

[dependencies]
csv.workspace = true
directories.workspace = true
fs4.workspace = true
globset.workspace = true
process-wrap.workspace = true
serde.workspace = true
sha2.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tract-onnx.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
ts-rs = { version = "12", optional = true, features = ["no-serde-warnings"] }
walkdir.workspace = true
which.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
insta.workspace = true
jsonschema.workspace = true
# Enables `test-support` for the integration tests in tests/.
rmedia-core = { path = ".", features = ["test-support"] }
rmedia-testkit.workspace = true
sysinfo.workspace = true
tempfile.workspace = true

[lints]
workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_System_Threading"] }
