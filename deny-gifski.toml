# cargo-deny policy for gifski's own Cargo.lock (feature 003, contracts/gif-tools-lock.md).
# Used only by `cargo xtask pin-gif-tools`: gifski is a separate, AGPL-3.0-or-later program that
# rmedia bundles unmodified, so its dependency licences are checked against this list, not the
# workspace's permissive-only deny.toml.

[graph]
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "AGPL-3.0-or-later",
    "AGPL-3.0-only",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
